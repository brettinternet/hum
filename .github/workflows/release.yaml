---
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify CI result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          run_id="$(gh run list --workflow ci.yaml --commit "$commit" --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "No main-branch push CI run found for tag commit $commit" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Generate release notes
        run: |
          set -eu
          previous_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            git cliff "${previous_tag}..${GITHUB_REF_NAME}" --strip all | tail -n +3 > release-notes.md
          else
            git cliff --strip all | tail -n +3 > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            if [ -n "$previous_tag" ]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME" > release-notes.md
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release-notes.md
            fi
          fi

      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$version" BUILD_TIME="$build_time" DATE="${build_time%%T*}" task cli:man

          for target in linux/amd64/x64 linux/arm64/arm64 darwin/amd64/x64 darwin/arm64/arm64; do
            IFS=/ read -r goos goarch asset_arch <<< "$target"
            case "$goos" in
              darwin) asset_os=macos ;;
              *) asset_os="$goos" ;;
            esac
            archive="hum-${version}-${asset_os}-${asset_arch}.tar.gz"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" mise exec go -- \
              go build -trimpath \
                -ldflags "-s -w -X main.buildVersion=${version} -X main.buildTime=${build_time}" \
                -o dist/hum ./cmd/hum
            tar -C dist -czf "dist/$archive" hum hum.1
          done

          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; reusing its immutable assets"
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
              --verify-tag --notes-file release-notes.md --title "${GITHUB_REF_NAME}"
          fi

      - name: Configure tap deploy key
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          arm64_asset="hum-${version}-macos-arm64.tar.gz"
          x64_asset="hum-${version}-macos-x64.tar.gz"
          published_dir="${RUNNER_TEMP}/published-release"
          mkdir -p "$published_dir"
          gh release download "$TAG" --pattern checksums.txt --dir "$published_dir"
          arm64_sha="$(awk -v asset="./${arm64_asset}" '$2 == asset { print $1 }' "$published_dir/checksums.txt")"
          x64_sha="$(awk -v asset="./${x64_asset}" '$2 == asset { print $1 }' "$published_dir/checksums.txt")"
          test -n "$arm64_sha"
          test -n "$x64_sha"

          tap_dir="${RUNNER_TEMP}/homebrew-tap"
          git clone git@github.com:brettinternet/homebrew-tap.git "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cat > "$tap_dir/Formula/hum.rb" <<FORMULA
          class Hum < Formula
            desc "Local development process supervisor"
            homepage "https://github.com/brettinternet/hum"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/brettinternet/hum/releases/download/${TAG}/${arm64_asset}"
                sha256 "${arm64_sha}"
              end
              on_intel do
                url "https://github.com/brettinternet/hum/releases/download/${TAG}/${x64_asset}"
                sha256 "${x64_sha}"
              end
            end

            def install
              bin.install "hum"
              man1.install "hum.1"
            end

            test do
              assert_match "hum version #{version}", shell_output("#{bin}/hum --version")
            end
          end
          FORMULA

          git -C "$tap_dir" config user.name "github-actions[bot]"
          git -C "$tap_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap_dir" add Formula/hum.rb
          if git -C "$tap_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$tap_dir" commit -m "hum ${TAG}"
          git -C "$tap_dir" push origin main

      - name: Update changelog
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            task changelog
            git add CHANGELOG.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore(release): update changelog for ${GITHUB_REF_NAME}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Changelog push raced with another main update; retrying ($attempt/3)" >&2
          done
          exit 1
