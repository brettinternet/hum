---
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify CI result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          run_id="$(gh run list --workflow ci.yaml --commit "$commit" --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "No main-branch push CI run found for tag commit $commit" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist

          for target in linux/amd64/x64 linux/arm64/arm64 darwin/amd64/x64 darwin/arm64/arm64; do
            IFS=/ read -r goos goarch asset_arch <<< "$target"
            case "$goos" in
              darwin) asset_os=macos ;;
              *) asset_os="$goos" ;;
            esac
            archive="hum-${version}-${asset_os}-${asset_arch}.tar.gz"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" mise exec go -- \
              go build -trimpath \
                -ldflags "-s -w -X main.buildVersion=${version} -X main.buildTime=${build_time}" \
                -o dist/hum ./cmd/hum
            tar -C dist -czf "dist/$archive" hum
          done

          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt
          --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
