project_name: "devproc"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: ["cli", "daemon", "process", "output", "protocol", "config", "integration", "security", "docs", "tooling", "human", "device", "credential", "blocked", "escalated", "container", "deferred"]
definition_of_done: ["task ci passes on the final commit", "Every checked acceptance criterion has an AC#N evidence line in Implementation Notes naming the command and its result", "An independent verifier pass returned PASS for every acceptance criterion", "The diff touches only the paths declared in the task's modified-file list, or the deviation is justified in Implementation Notes", "No test was deleted, skipped, or weakened", "No protected gate file was modified unless the owner labelled this task tooling", "Committed on main with the task ID in the commit subject and a Task: trailer"]
date_format: yyyy-mm-dd
max_column_width: 40
default_editor: "code --wait"
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "DEVPROC"
