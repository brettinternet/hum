---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  setup: .taskfiles/setup.yaml
  backlog: .taskfiles/backlog.yaml
  cli: .taskfiles/cli.yaml

tasks:
  default:
    silent: true
    cmd: task -l

  init:
    desc: Install toolchain, dependencies, and hooks
    aliases: [setup]
    deps:
      - task: setup:init
    cmds:
      - task: cli:init

  ci:
    desc: The gate. Everything that must pass before a backlog task is Done.
    cmds:
      - task: security
      - task: check
      - task: test
      - task: race
      - task: smoke

  security:
    desc: Scan repository history for secrets and Go code for reachable vulnerabilities
    cmds:
      - mise exec gitleaks -- gitleaks git --redact --verbose --no-banner
      - mise exec go:golang.org/x/vuln/cmd/govulncheck -- govulncheck ./...

  check:
    desc: Run all project checks
    deps:
      - task: cli:check

  check:go-min:
    desc: Build and test source with the minimum supported Go version
    cmd: CGO_ENABLED=0 mise exec go@1.22 -- go test ./...

  check:staged:
    desc: Format and run checks only for staged files
    aliases: [check-staged]
    cmd: mise exec lefthook -- lefthook run pre-commit

  fix:staged:
    desc: Format and re-stage staged files
    aliases: [fix-staged]
    cmd: mise exec lefthook -- lefthook run pre-commit --tag fix

  fix:
    desc: Fix all project files
    deps:
      - task: cli:fix

  test:
    desc: Run all tests
    deps:
      - task: cli:test

  coverage:
    desc: Run all tests and print function coverage
    cmds:
      - mise exec go -- go test ./... -coverprofile=/tmp/hum-coverage.out
      - mise exec go -- go tool cover -func=/tmp/hum-coverage.out

  race:
    desc: Run race-sensitive package tests
    cmd: mise exec go -- go test -race ./...

  smoke:
    desc: Build hum and run built-binary smoke coverage
    deps:
      - task: cli:build
    cmd: mise exec go -- go test ./cmd/hum -run TestBuiltBinaryIntegration -count=1
