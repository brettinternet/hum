---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Initialize CLI
    cmd:
      task: setup

  setup:
    desc: Download Go modules
    cmd: mise exec go -- go mod download

  setup-ci:
    desc: Download Go modules in CI
    cmd: mise exec go -- go mod download

  build:
    desc: Build hum
    cmds:
      - mkdir -p bin
      - mise exec go -- go build -o bin/hum ./cmd/hum

  run:
    desc: Run hum from source
    cmd: mise exec go -- go run ./cmd/hum {{.CLI_ARGS}}

  man:
    desc: Generate the hum(1) manual page in dist
    cmds:
      - mkdir -p dist
      - mise exec go -- go run ./cmd/hum-man --version "${VERSION:-dev}" --build-time "${BUILD_TIME:-unknown}" --date "${DATE:-$(date -u +%Y-%m-%d)}" > dist/hum.1

  check:
    desc: Run source checks
    cmds:
      - test -z "$(find . \( -type d \( -name .git -o -name .worktrees -o -name bin -o -name build -o -name dist -o -name gen -o -name generated -o -name vendor \) -prune \) -o -type f -name '*.go' -exec mise exec go -- gofmt -l {} +)"
      - mise exec go -- go vet ./...
      - mise exec staticcheck -- staticcheck ./...
      - python3 -m unittest discover -s plugins/herdr -p 'test_*.py'

  fix:
    desc: Format Go files
    cmd: find . \( -type d \( -name .git -o -name .worktrees -o -name bin -o -name build -o -name dist -o -name gen -o -name generated -o -name vendor \) -prune \) -o -type f -name '*.go' -exec mise exec go -- gofmt -w {} +

  test:
    desc: Run tests
    cmds:
      - mise exec go -- go test ./...
      - python3 -m unittest discover -s plugins/herdr -p 'test_*.py'
