version: "3"

vars:
  WINDOWS_PACKAGES: ./...
  HOST_OS:
    sh: go env GOHOSTOS

tasks:
  test:
    desc: Run all packages natively on Windows
    preconditions:
      - sh: '[ "{{.HOST_OS}}" = windows ]'
        msg: A Windows host is required for windows:test
    cmds:
      - go test -count=1 {{if .RUN}}-run "{{.RUN}}"{{end}} {{.WINDOWS_PACKAGES}}

  package:
    desc: Cross-build the Windows amd64 release zip
    platforms: [darwin, linux]
    cmds:
      - |
        set -eu
        version="${VERSION:-dev}"
        build_time="${BUILD_TIME:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
        commit="${BUILD_COMMIT:-$(git rev-parse HEAD)}"
        mkdir -p dist
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 mise exec go -- \
          go build -trimpath \
            -ldflags "-s -w -X main.buildVersion=${version} -X main.buildCommit=${commit} -X main.buildTime=${build_time}" \
            -o dist/hum.exe ./cmd/hum
        zip -j -q "dist/hum-${version}-windows-x64.zip" dist/hum.exe

  package:smoke:
    desc: Build and verify the Windows release zip and its checksum
    platforms: [darwin, linux]
    cmds:
      - task: package
      - |
        set -eu
        cd dist
        archive="hum-${VERSION:-dev}-windows-x64.zip"
        test "$(unzip -Z -1 "$archive")" = hum.exe
        shasum -a 256 "./$archive" > checksums.txt
        shasum -a 256 -c checksums.txt

  watch:
    desc: Wait for the Windows-branch CI run matching HEAD and report its result
    platforms: [darwin, linux]
    silent: true
    cmds:
      - |
        sha="$(git rev-parse HEAD)"
        for attempt in 1 2 3 4 5 6; do
          run_id="$(gh run list --workflow ci.yaml --commit "$sha" --limit 50 --json databaseId,headBranch --jq '[.[] | select(.headBranch | startswith("windows/"))][0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            echo "Watching ci.yaml run $run_id for $sha"
            gh run watch "$run_id" --exit-status
            exit $?
          fi
          if [ "$attempt" -lt 6 ]; then sleep 5; fi
        done
        echo "No Windows-branch ci.yaml run appeared for $sha" >&2
        exit 1
