# yaml-language-server: $schema=https://raw.githubusercontent.com/brettinternet/hum/main/hum.schema.json
version: 1
processes:
  db:
    # argv runs directly, without shell parsing.
    argv: [docker, compose, up, db]
    ready:
      match: "ready"
  api:
    argv: [bun, run, api]
    after: [db]
    ready:
      match: "Listening"
      timeout: 30s # Defaults to 30s.
    restart: on-failure # Defaults to never.
  web:
    argv: [bun, run, dev]
    # cwd is relative to the project root.
    cwd: web
    # after waits until every dependency is ready.
    after: [api]
    ready:
      match: "Local:"
    tty: true # Defaults to false.
